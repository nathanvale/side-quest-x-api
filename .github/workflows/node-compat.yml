name: Node.js Compatibility Check

on:
  # Verify the built CLI works on Node.js (since Bun is now primary runtime)
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-compat:
    name: Node.js Compatibility
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Standard CI Env
        uses: ./.github/actions/standard-ci-env

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (TypeScript)
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Node.js CLI smoke test
        if: hashFiles('dist/bin/index.js') != ''
        run: node ./dist/bin/index.js --help

      - name: Verify ESM imports work on Node.js
        if: hashFiles('dist/index.js') != ''
        run: |
          node -e "import('./dist/index.js').then(m => console.log('ESM import OK, exports:', Object.keys(m)))"
